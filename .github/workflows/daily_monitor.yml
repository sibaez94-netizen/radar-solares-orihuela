name: Radar Diario Solares Vega Baja

on:
  schedule:
    # Se ejecuta todos los días a las 07:30 UTC (08:30 / 09:30 hora peninsular española)
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio con el histórico
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias de scraping
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Agente (IMAP + Portales + Inmobiliarias Locales + Email Diario)
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST || 'imap.gmail.com' }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.IMAP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.IMAP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || secrets.IMAP_USER }}
          DASHBOARD_URL: https://sibaez94-netizen.github.io/radar-solares-orihuela/
        run: |
          python main.py

      - name: Guardar cambios históricos en el repositorio (SQLite + JSON Panel Web)
        run: |
          git config user.name "Agente Solares Bot"
          git config user.email "bot@agentesolares.local"
          git add data/solares.db docs/data/listings.json docs/data/listings.js docs/last_email_preview.html
          git diff --staged --quiet || (git commit -m "chore(radar): actualización diaria de precios y solares ($(date +'%Y-%m-%d'))" && git pull --rebase -X theirs origin main && git push)
